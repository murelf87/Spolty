<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spotly</title>
<style>
/*
 * Vista previa de Spotly dentro de un móvil (no forma parte de la app de producción).
 * <html> es la mesa y <body> es la pantalla del teléfono. Como <body> lleva transform, todo lo que la app
 * coloca con position:fixed (overlays, barra de navegación, toasts) se posiciona respecto a la pantalla del
 * teléfono y no respecto a la ventana. #root es la zona con scroll, igual que el documento en un móvil.
 * Aquí solo hay reglas para html, body, #root y piezas .pv-*: nada que pise las utilidades de Tailwind.
 * El tamaño, los márgenes seguros y el radio dependen del dispositivo elegido (script de abajo).
 */
html {
  --pv-gap: 0px;
  height: 100%;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  background-color: #07060d;
  background-image:
    radial-gradient(60% 50% at 50% 0%, rgb(124 58 237 / 0.28), transparent 70%),
    radial-gradient(45% 40% at 88% 100%, rgb(34 211 238 / 0.14), transparent 70%),
    radial-gradient(40% 35% at 8% 96%, rgb(232 121 249 / 0.12), transparent 70%);
}
html:not(.pv-bleed) { --pv-gap: 64px; padding-bottom: var(--pv-gap); }
body {
  position: relative;
  flex: none;
  box-sizing: border-box;
  width: var(--pv-w, 390px);
  height: var(--pv-h, 844px);
  margin: 0;
  overflow: hidden;
  border-radius: var(--pv-r, 55px);
  transform: scale(var(--pv-s, 1));
  /* El visor de artifacts añade su propio reset (fondo, tipografía y color): vuelven a los de la app. */
  background: revert-layer;
  font: revert-layer;
  color: revert-layer;
  box-shadow:
    0 0 0 10px #050507,
    0 0 0 11px #26252c,
    0 0 0 13px #4b4a53,
    0 0 0 14px #18171c,
    0 48px 90px -24px rgb(0 0 0 / 0.85),
    0 0 110px rgb(124 58 237 / 0.2);
}
/* iPhone SE: frente y barbilla altas detrás de la pantalla. */
html[data-pv-kind="classic"] body {
  box-shadow:
    0 0 0 10px #050507,
    0 -72px 0 10px #0c0c11,
    0 72px 0 10px #0c0c11,
    0 0 0 11px #26252c,
    0 -72px 0 11px #26252c,
    0 72px 0 11px #26252c,
    0 48px 90px -24px rgb(0 0 0 / 0.85),
    0 0 110px rgb(124 58 237 / 0.2);
}
img { max-width: revert-layer; }
#root {
  height: 100%;
  overflow-x: hidden;
  overflow-y: auto;
  overscroll-behavior: contain;
}

/* Botones laterales: quedan fuera de la pantalla, por eso cuelgan de <html>. */
html::before, html::after {
  content: "";
  position: fixed;
  pointer-events: none;
  width: calc(3px * var(--pv-s, 1));
  border-radius: 2px;
}
html::before {
  left: calc(50% - (var(--pv-w, 390px) / 2 + 17px) * var(--pv-s, 1));
  top: calc(50% - var(--pv-gap) / 2 - var(--pv-h, 844px) * var(--pv-s, 1) / 2 + 112px * var(--pv-s, 1));
  height: calc(196px * var(--pv-s, 1));
  background: linear-gradient(#3d3c45 0 16%, transparent 16% 31%, #3d3c45 31% 62%, transparent 62% 69%, #3d3c45 69% 100%);
}
html::after {
  left: calc(50% + (var(--pv-w, 390px) / 2 + 14px) * var(--pv-s, 1));
  top: calc(50% - var(--pv-gap) / 2 - var(--pv-h, 844px) * var(--pv-s, 1) / 2 + 190px * var(--pv-s, 1));
  height: calc(100px * var(--pv-s, 1));
  background: #3d3c45;
}

/* Barra de estado, cámara e indicador de inicio, por encima de todo y sin capturar toques. */
.pv-chrome { position: absolute; inset: 0; z-index: 2147483647; pointer-events: none; color: #fff; }
.pv-status {
  position: absolute; inset: 0 0 auto; height: 54px; padding-top: 4px; box-sizing: border-box;
  display: grid; grid-template-columns: 1fr 125px 1fr; align-items: center;
  font: 600 16px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
  letter-spacing: -0.01em; font-variant-numeric: tabular-nums;
}
.pv-time { justify-self: center; padding-left: 8px; }
.pv-icons { justify-self: center; display: flex; align-items: center; gap: 5px; padding-right: 6px; }
.pv-icons svg { display: block; fill: currentColor; }
.pv-island { position: absolute; top: 11px; left: 50%; width: 125px; height: 36px; margin-left: -62.5px; border-radius: 18px; background: #000; }
.pv-island::after {
  content: ""; position: absolute; right: 21px; top: 50%; width: 11px; height: 11px; margin-top: -5.5px; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #2c3654 0 22%, #0c0e16 62%);
}
.pv-home { position: absolute; bottom: 8px; left: 50%; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: currentColor; opacity: 0.85; }
/* Android: cámara perforada, hora a la izquierda y barra de gestos. */
html[data-pv-kind="hole"] .pv-status { height: 28px; padding: 0 18px; grid-template-columns: 1fr auto 1fr; font-size: 13px; font-weight: 500; }
html[data-pv-kind="hole"] .pv-time { justify-self: start; padding: 0; }
html[data-pv-kind="hole"] .pv-icons { justify-self: end; padding: 0; gap: 4px; }
html[data-pv-kind="hole"] .pv-icons svg { transform: scale(0.85); }
html[data-pv-kind="hole"] .pv-island { top: 8px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; }
html[data-pv-kind="hole"] .pv-island::after { display: none; }
html[data-pv-kind="hole"] .pv-home { bottom: 6px; width: 100px; height: 4px; margin-left: -50px; }
/* iPhone SE: barra de 20 px con la hora en el centro, sin isla ni indicador de inicio. */
html[data-pv-kind="classic"] .pv-status { height: 20px; padding: 0 6px; grid-template-columns: 1fr auto 1fr; font-size: 12px; }
html[data-pv-kind="classic"] .pv-time { order: 2; justify-self: center; padding: 0; }
html[data-pv-kind="classic"] .pv-status > span:nth-child(2) { order: 1; }
html[data-pv-kind="classic"] .pv-icons { order: 3; justify-self: end; padding: 0; gap: 3px; }
html[data-pv-kind="classic"] .pv-icons svg { transform: scale(0.75); }
html[data-pv-kind="classic"] .pv-island, html[data-pv-kind="classic"] .pv-home { display: none; }
html.light .pv-chrome { color: #0b0b12; }
.pv-dragging, .pv-dragging * { user-select: none !important; cursor: grabbing !important; }

/* Selector de dispositivo (fuera de la pantalla, cuelga de <html>). */
.pv-devices {
  position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 2;
  display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; max-width: calc(100vw - 24px); padding: 4px;
  border: 1px solid rgb(255 255 255 / 0.1); border-radius: 999px; background: rgb(255 255 255 / 0.06);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  font: 600 12px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
}
.pv-devices button {
  appearance: none; border: 0; margin: 0; cursor: pointer; padding: 8px 12px; border-radius: 999px;
  background: transparent; color: rgb(255 255 255 / 0.68); font: inherit; white-space: nowrap;
}
.pv-devices button:hover { color: #fff; }
.pv-devices button[aria-pressed="true"] { background: rgb(255 255 255 / 0.15); color: #fff; }
.pv-devices button:focus-visible { outline: 2px solid rgb(34 211 238 / 0.8); outline-offset: 1px; }

/* Pantalla estrecha (abierto desde un móvil): la app ocupa toda la vista, sin marco ni selector. */
html.pv-bleed { display: block; }
html.pv-bleed body { width: 100%; height: 100%; border-radius: 0; box-shadow: none; }
html.pv-bleed::before, html.pv-bleed::after, html.pv-bleed .pv-chrome, html.pv-bleed .pv-devices { display: none; }
</style>
<script>
/* Dispositivos simulados: tamaño de pantalla en px CSS, márgenes seguros y radio de esquina reales. El teléfono entero
   se reduce con scale() si la ventana no da para tanto, nunca se deforma. Se puede fijar con #se, #promax, #android, #pixel, #fold… */
(function () {
  var DEVICES = {
    iphone: { label: "iPhone 15", w: 390, h: 844, top: 59, bottom: 34, r: 55, kind: "island" },
    promax: { label: "Pro Max", w: 430, h: 932, top: 59, bottom: 34, r: 55, kind: "island" },
    se: { label: "iPhone SE", w: 375, h: 667, top: 20, bottom: 0, r: 4, kind: "classic" },
    android: { label: "Android", w: 360, h: 780, top: 28, bottom: 16, r: 34, kind: "hole" },
    pixel: { label: "Pixel", w: 412, h: 915, top: 32, bottom: 16, r: 38, kind: "hole" },
    fold: { label: "Fold", w: 344, h: 882, top: 28, bottom: 16, r: 26, kind: "hole" },
    mini: { label: "320 px", w: 320, h: 568, top: 20, bottom: 0, r: 4, kind: "classic" }
  };
  var BEZEL = 15, MARGIN = 20, d = document.documentElement;
  var VARS = ["--pv-w", "--pv-h", "--pv-r", "--pv-vh", "--pv-vw", "--pv-safe-top", "--pv-safe-bottom", "--pv-safe-left", "--pv-safe-right"];
  function stored() { try { return localStorage.getItem("pv-device"); } catch (e) { return null; } }
  function chosen() {
    var id = window.PV_DEVICE || location.hash.slice(1) || stored();
    return DEVICES[id] ? id : "iphone";
  }
  var current = chosen();
  function fit() {
    var dev = DEVICES[current], vw = d.clientWidth, vh = d.clientHeight, st = d.style;
    var bleed = vw < 520 || vh < 500;
    d.classList.toggle("pv-bleed", bleed);
    d.setAttribute("data-pv-device", current);
    d.setAttribute("data-pv-kind", dev.kind);
    if (bleed) {
      VARS.forEach(function (p) { st.removeProperty(p); });
      st.setProperty("--pv-s", "1");
      /* Si el visor ya aparta la página de las barras del sistema, la app no debe sumar el inset otra vez. */
      var cs = getComputedStyle(d);
      if (parseFloat(cs.paddingTop) > 0) st.setProperty("--pv-safe-top", "0px");
      if (parseFloat(cs.paddingBottom) > 0) st.setProperty("--pv-safe-bottom", "0px");
      return;
    }
    var extra = dev.kind === "classic" ? 72 : 0; /* frente y barbilla del SE */
    var gap = parseFloat(getComputedStyle(d).getPropertyValue("--pv-gap")) || 0;
    var scale = Math.min(1, (vw - 2 * MARGIN) / (dev.w + 2 * BEZEL), (vh - 2 * MARGIN - gap) / (dev.h + 2 * BEZEL + 2 * extra));
    st.setProperty("--pv-s", String(Math.round(scale * 1000) / 1000));
    st.setProperty("--pv-w", dev.w + "px");
    st.setProperty("--pv-h", dev.h + "px");
    st.setProperty("--pv-r", dev.r + "px");
    st.setProperty("--pv-vh", dev.h / 100 + "px");
    st.setProperty("--pv-vw", dev.w / 100 + "px");
    st.setProperty("--pv-safe-top", dev.top + "px");
    st.setProperty("--pv-safe-bottom", dev.bottom + "px");
    st.setProperty("--pv-safe-left", "0px");
    st.setProperty("--pv-safe-right", "0px");
  }
  function select(id) {
    current = id;
    try { localStorage.setItem("pv-device", id); } catch (e) { /* sin almacenamiento: solo esta sesión */ }
    fit();
    document.querySelectorAll(".pv-devices button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.value === id)); });
    window.dispatchEvent(new Event("resize")); /* la app recalcula como al girar o cambiar de móvil */
  }
  function mountSwitcher() {
    var bar = document.createElement("div");
    bar.className = "pv-devices";
    bar.setAttribute("role", "group");
    bar.setAttribute("aria-label", "Dispositivo de la vista previa");
    Object.keys(DEVICES).forEach(function (id) {
      var b = document.createElement("button");
      b.type = "button"; b.value = id; b.textContent = DEVICES[id].label;
      b.setAttribute("aria-pressed", String(id === current));
      b.addEventListener("click", function () { select(id); });
      bar.appendChild(b);
    });
    d.appendChild(bar);
  }
  fit();
  addEventListener("resize", fit);
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", mountSwitcher); else mountSwitcher();
})();
</script>
</head>
<body>
<div class="pv-chrome" aria-hidden="true">
  <div class="pv-status">
    <span class="pv-time">9:41</span>
    <span></span>
    <span class="pv-icons">
      <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="7.5" width="3" height="4.5" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 2.4c2.3 0 4.4.9 6 2.4l1.2-1.3A10.4 10.4 0 0 0 8 .6C5.2.6 2.7 1.7.8 3.5L2 4.8a8.6 8.6 0 0 1 6-2.4Zm0 3.6c1.3 0 2.5.5 3.4 1.3l1.2-1.3A6.7 6.7 0 0 0 8 4.2c-1.8 0-3.4.7-4.6 1.8l1.2 1.3c.9-.8 2.1-1.3 3.4-1.3Zm0 3.5c-.6 0-1.2.2-1.6.6L8 11.8l1.6-1.7c-.4-.4-1-.6-1.6-.6Z"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="23" height="12" rx="3.8" fill="none" stroke="currentColor" stroke-opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2.5"/><path d="M25 4.5v4c.8-.3 1.4-1.1 1.4-2s-.6-1.7-1.4-2Z" fill-opacity=".45"/></svg>
    </span>
  </div>
  <div class="pv-island"></div>
  <div class="pv-home"></div>
</div>
<div id="root"></div>
<script type="module" src="./main.tsx"></script>
</body>
</html>
